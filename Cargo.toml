[package]
name = "polars-crs"
version = "0.1.7"
edition = "2021"

[lib]
name = "polars_crs"
crate-type= ["cdylib"]

[dependencies]
pyo3 = { version = "0.26.0", features = ["extension-module", "abi3-py39"] }
pyo3-polars = { version = "0.25.0", features = ["derive", "dtype-struct", "dtype-array"] }
serde = { version = "1", features = ["derive"] }
# Without these, casting a small integer or a Decimal column panics inside a
# non-unwinding boundary and aborts the interpreter, which no caller can catch.
polars = { version = "0.52.0", default-features = false, features = [
  "dtype-i8", "dtype-i16", "dtype-u8", "dtype-u16", "dtype-decimal",
] }
polars-arrow = { version = "0.52.0", default-features = false }
rayon = "1.12.0"

