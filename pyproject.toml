[build-system]
requires = ["maturin>=1.0,<2.0", "polars>=1.3.0"]
build-backend = "maturin"

[project]
name = "polars-crs"
description = "Detect which coordinate reference system unlabelled x/y columns are in, from the values."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Benjamin Naderi" }]
# The wheels are cp39-abi3, so 3.8 users would silently fall back to building
# the sdist from source.
requires-python = ">=3.9"
keywords = ["polars", "geospatial", "crs", "epsg", "projection", "coordinates"]
dependencies = ["polars>=1.3.0"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/benjamin-naderi-gh/polars-crs"
Repository = "https://github.com/benjamin-naderi-gh/polars-crs"
Issues = "https://github.com/benjamin-naderi-gh/polars-crs/issues"

[tool.pytest.ini_options]
pythonpath = ["tests"]

[tool.maturin]
module-name = "polars_crs._internal"

[[tool.mypy.overrides]]
module = "polars.utils.udfs"
ignore_missing_imports = true
